<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .entity-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); rx: 8px; }
      .header-user { fill: #3b82f6; }
      .header-wallet { fill: #10b981; }
      .header-session { fill: #8b5cf6; }
      .header-txn { fill: #0d9488; }
      .header-billing { fill: #f59e0b; }
      .header-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .attr-name { font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .attr-type { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .pk-badge { fill: #fee2e2; stroke: #ef4444; stroke-width: 1; rx: 3; }
      .pk-text { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 800; fill: #b91c1c; }
      .fk-badge { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; rx: 3; }
      .fk-text { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 800; fill: #0369a1; }
      .rel-line { stroke: #475569; stroke-width: 2px; fill: none; }
      .rel-label-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 4; }
      .rel-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .legend-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #475569; }
      .divider { stroke: #f1f5f9; stroke-width: 1; }
    </style>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <!-- Crow's foot circle marker -->
    <marker id="one" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <circle cx="6" cy="6" r="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Diagram Header -->
  <text x="50" y="42" class="title">Astrokarma Database Entity Relationship Diagram (ERD)</text>
  <text x="50" y="62" class="subtitle">Complete relational architecture for Wallet Management and Per-Minute Consultation Session Billing</text>

  <!-- ================= ENTITY 1: USER ================= -->
  <g transform="translate(50, 95)">
    <rect width="280" height="310" class="entity-box" />
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 36 L 0 36 Z" class="header-user" />
    <text x="15" y="24" class="header-text">users_user (Custom User)</text>

    <!-- Attributes -->
    <!-- id -->
    <rect x="15" y="47" width="24" height="15" class="pk-badge"/>
    <text x="20" y="58" class="pk-text">PK</text>
    <text x="47" y="59" class="attr-name">id</text>
    <text x="200" y="59" class="attr-type">BigAutoField</text>
    <line x1="10" y1="70" x2="270" y2="70" class="divider" />

    <!-- username -->
    <text x="15" y="87" class="attr-name">username</text>
    <text x="175" y="87" class="attr-type">VarChar(150) (UQ)</text>
    <line x1="10" y1="97" x2="270" y2="97" class="divider" />

    <!-- email -->
    <text x="15" y="114" class="attr-name">email</text>
    <text x="175" y="114" class="attr-type">VarChar(254) (UQ)</text>
    <line x1="10" y1="124" x2="270" y2="124" class="divider" />

    <!-- password -->
    <text x="15" y="141" class="attr-name">password</text>
    <text x="175" y="141" class="attr-type">VarChar(128)</text>
    <line x1="10" y1="151" x2="270" y2="151" class="divider" />

    <!-- role -->
    <text x="15" y="168" class="attr-name">role</text>
    <text x="160" y="168" class="attr-type">USER | PROVIDER</text>
    <line x1="10" y1="178" x2="270" y2="178" class="divider" />

    <!-- per_minute_rate -->
    <text x="15" y="195" class="attr-name">per_minute_rate</text>
    <text x="175" y="195" class="attr-type">Decimal(10,2)</text>
    <line x1="10" y1="205" x2="270" y2="205" class="divider" />

    <!-- is_active -->
    <text x="15" y="222" class="attr-name">is_active</text>
    <text x="175" y="222" class="attr-type">Boolean</text>
    <line x1="10" y1="232" x2="270" y2="232" class="divider" />

    <!-- is_staff -->
    <text x="15" y="249" class="attr-name">is_staff</text>
    <text x="175" y="249" class="attr-type">Boolean</text>
    <line x1="10" y1="259" x2="270" y2="259" class="divider" />

    <!-- date_joined -->
    <text x="15" y="276" class="attr-name">date_joined</text>
    <text x="175" y="276" class="attr-type">DateTimeField</text>
  </g>

  <!-- ================= ENTITY 2: WALLET ================= -->
  <g transform="translate(440, 95)">
    <rect width="270" height="200" class="entity-box" />
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 36 L 0 36 Z" class="header-wallet" />
    <text x="15" y="24" class="header-text">wallets_wallet (Prepaid Wallet)</text>

    <!-- id -->
    <rect x="15" y="47" width="24" height="15" class="pk-badge"/>
    <text x="20" y="58" class="pk-text">PK</text>
    <text x="47" y="59" class="attr-name">id</text>
    <text x="180" y="59" class="attr-type">BigAutoField</text>
    <line x1="10" y1="70" x2="260" y2="70" class="divider" />

    <!-- user_id -->
    <rect x="15" y="77" width="24" height="15" class="fk-badge"/>
    <text x="20" y="88" class="fk-text">FK</text>
    <text x="47" y="89" class="attr-name">user_id</text>
    <text x="155" y="89" class="attr-type">BigInt (1:1, UQ)</text>
    <line x1="10" y1="100" x2="260" y2="100" class="divider" />

    <!-- balance -->
    <text x="15" y="119" class="attr-name">balance</text>
    <text x="145" y="119" class="attr-type">Decimal(12,2) &gt;= 0</text>
    <line x1="10" y1="130" x2="260" y2="130" class="divider" />

    <!-- created_at -->
    <text x="15" y="149" class="attr-name">created_at</text>
    <text x="175" y="149" class="attr-type">DateTimeField</text>
    <line x1="10" y1="160" x2="260" y2="160" class="divider" />

    <!-- updated_at -->
    <text x="15" y="179" class="attr-name">updated_at</text>
    <text x="175" y="179" class="attr-type">DateTimeField</text>
  </g>

  <!-- ================= ENTITY 3: WALLET TRANSACTION ================= -->
  <g transform="translate(820, 95)">
    <rect width="330" height="320" class="entity-box" />
    <path d="M 0 8 Q 0 0 8 0 L 322 0 Q 330 0 330 8 L 330 36 L 0 36 Z" class="header-txn" />
    <text x="15" y="24" class="header-text">wallets_wallettransaction (Audit Log)</text>

    <!-- id -->
    <rect x="15" y="47" width="24" height="15" class="pk-badge"/>
    <text x="20" y="58" class="pk-text">PK</text>
    <text x="47" y="59" class="attr-name">id</text>
    <text x="240" y="59" class="attr-type">BigAutoField</text>
    <line x1="10" y1="70" x2="320" y2="70" class="divider" />

    <!-- wallet_id -->
    <rect x="15" y="77" width="24" height="15" class="fk-badge"/>
    <text x="20" y="88" class="fk-text">FK</text>
    <text x="47" y="89" class="attr-name">wallet_id</text>
    <text x="240" y="89" class="attr-type">BigInt</text>
    <line x1="10" y1="100" x2="320" y2="100" class="divider" />

    <!-- user_id -->
    <rect x="15" y="107" width="24" height="15" class="fk-badge"/>
    <text x="20" y="118" class="fk-text">FK</text>
    <text x="47" y="119" class="attr-name">user_id</text>
    <text x="240" y="119" class="attr-type">BigInt</text>
    <line x1="10" y1="130" x2="320" y2="130" class="divider" />

    <!-- amount -->
    <text x="15" y="149" class="attr-name">amount</text>
    <text x="210" y="149" class="attr-type">Decimal(12,2) &gt;= 0.01</text>
    <line x1="10" y1="160" x2="320" y2="160" class="divider" />

    <!-- transaction_type -->
    <text x="15" y="179" class="attr-name">transaction_type</text>
    <text x="180" y="179" class="attr-type">recharge | debit | refund</text>
    <line x1="10" y1="190" x2="320" y2="190" class="divider" />

    <!-- reference -->
    <text x="15" y="209" class="attr-name">reference</text>
    <text x="200" y="209" class="attr-type">VarChar(100) (UQ, IDX)</text>
    <line x1="10" y1="220" x2="320" y2="220" class="divider" />

    <!-- status -->
    <text x="15" y="239" class="attr-name">status</text>
    <text x="195" y="239" class="attr-type">pending | success | fail</text>
    <line x1="10" y1="250" x2="320" y2="250" class="divider" />

    <!-- description -->
    <text x="15" y="269" class="attr-name">description</text>
    <text x="235" y="269" class="attr-type">VarChar(255)</text>
    <line x1="10" y1="280" x2="320" y2="280" class="divider" />

    <!-- created_at -->
    <text x="15" y="299" class="attr-name">created_at</text>
    <text x="235" y="299" class="attr-type">DateTimeField</text>
  </g>

  <!-- ================= ENTITY 4: CONSULTATION SESSION ================= -->
  <g transform="translate(50, 480)">
    <rect width="360" height="360" class="entity-box" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 36 L 0 36 Z" class="header-session" />
    <text x="15" y="24" class="header-text">consultations_consultationsession</text>

    <!-- id -->
    <rect x="15" y="47" width="24" height="15" class="pk-badge"/>
    <text x="20" y="58" class="pk-text">PK</text>
    <text x="47" y="59" class="attr-name">id</text>
    <text x="270" y="59" class="attr-type">BigAutoField</text>
    <line x1="10" y1="70" x2="350" y2="70" class="divider" />

    <!-- user_id -->
    <rect x="15" y="77" width="24" height="15" class="fk-badge"/>
    <text x="20" y="88" class="fk-text">FK</text>
    <text x="47" y="89" class="attr-name">user_id (Client)</text>
    <text x="270" y="89" class="attr-type">BigInt</text>
    <line x1="10" y1="100" x2="350" y2="100" class="divider" />

    <!-- provider_id -->
    <rect x="15" y="107" width="24" height="15" class="fk-badge"/>
    <text x="20" y="118" class="fk-text">FK</text>
    <text x="47" y="119" class="attr-name">provider_id (Astrologer)</text>
    <text x="250" y="119" class="attr-type">BigInt (Null)</text>
    <line x1="10" y1="130" x2="350" y2="130" class="divider" />

    <!-- status -->
    <text x="15" y="149" class="attr-name">status</text>
    <text x="200" y="149" class="attr-type">unassigned..completed</text>
    <line x1="10" y1="160" x2="350" y2="160" class="divider" />

    <!-- per_minute_rate -->
    <text x="15" y="179" class="attr-name">per_minute_rate</text>
    <text x="260" y="179" class="attr-type">Decimal(10,2)</text>
    <line x1="10" y1="190" x2="350" y2="190" class="divider" />

    <!-- started_at / ended_at -->
    <text x="15" y="209" class="attr-name">started_at</text>
    <text x="250" y="209" class="attr-type">DateTime (Null)</text>
    <line x1="10" y1="220" x2="350" y2="220" class="divider" />

    <text x="15" y="239" class="attr-name">ended_at</text>
    <text x="250" y="239" class="attr-type">DateTime (Null)</text>
    <line x1="10" y1="250" x2="350" y2="250" class="divider" />

    <!-- duration & billed -->
    <text x="15" y="269" class="attr-name">total_duration_seconds</text>
    <text x="270" y="269" class="attr-type">Integer</text>
    <line x1="10" y1="280" x2="350" y2="280" class="divider" />

    <text x="15" y="299" class="attr-name">total_billed_minutes</text>
    <text x="270" y="299" class="attr-type">Integer</text>
    <line x1="10" y1="310" x2="350" y2="310" class="divider" />

    <text x="15" y="329" class="attr-name">total_billed_amount</text>
    <text x="260" y="329" class="attr-type">Decimal(12,2)</text>
    <line x1="10" y1="340" x2="350" y2="340" class="divider" />

    <!-- ended_by & reason -->
    <text x="15" y="349" class="attr-name">ended_by / end_reason</text>
    <text x="220" y="349" class="attr-type">user | provider | sys</text>
  </g>

  <!-- ================= ENTITY 5: SESSION BILLING RECORD ================= -->
  <g transform="translate(540, 530)">
    <rect width="360" height="240" class="entity-box" />
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 36 L 0 36 Z" class="header-billing" />
    <text x="15" y="24" class="header-text">consultations_sessionbillingrecord</text>

    <!-- id -->
    <rect x="15" y="47" width="24" height="15" class="pk-badge"/>
    <text x="20" y="58" class="pk-text">PK</text>
    <text x="47" y="59" class="attr-name">id</text>
    <text x="270" y="59" class="attr-type">BigAutoField</text>
    <line x1="10" y1="70" x2="350" y2="70" class="divider" />

    <!-- session_id -->
    <rect x="15" y="77" width="24" height="15" class="fk-badge"/>
    <text x="20" y="88" class="fk-text">FK</text>
    <text x="47" y="89" class="attr-name">session_id</text>
    <text x="270" y="89" class="attr-type">BigInt</text>
    <line x1="10" y1="100" x2="350" y2="100" class="divider" />

    <!-- minute_number -->
    <text x="15" y="119" class="attr-name">minute_number</text>
    <text x="180" y="119" class="attr-type">Integer (Min: 1) [UQ: (sess, min)]</text>
    <line x1="10" y1="130" x2="350" y2="130" class="divider" />

    <!-- amount -->
    <text x="15" y="149" class="attr-name">amount</text>
    <text x="260" y="149" class="attr-type">Decimal(10,2)</text>
    <line x1="10" y1="160" x2="350" y2="160" class="divider" />

    <!-- wallet_transaction_id -->
    <rect x="15" y="177" width="24" height="15" class="fk-badge"/>
    <text x="20" y="188" class="fk-text">FK</text>
    <text x="47" y="189" class="attr-name">wallet_transaction_id</text>
    <text x="240" y="189" class="attr-type">BigInt (1:1, UQ)</text>
    <line x1="10" y1="200" x2="350" y2="200" class="divider" />

    <!-- billed_at -->
    <text x="15" y="219" class="attr-name">billed_at</text>
    <text x="260" y="219" class="attr-type">DateTimeField</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTIONS ================= -->

  <!-- 1. USER to WALLET (1 : 1) -->
  <path d="M 330 190 L 440 190" class="rel-line" />
  <rect x="355" y="177" width="55" height="22" class="rel-label-box" />
  <text x="363" y="193" class="rel-text">1 : 1</text>

  <!-- 2. WALLET to WALLET_TRANSACTION (1 : N) -->
  <path d="M 710 190 L 820 190" class="rel-line" marker-end="url(#arrow)" />
  <rect x="735" y="177" width="55" height="22" class="rel-label-box" />
  <text x="743" y="193" class="rel-text">1 : N</text>

  <!-- 3. USER to CONSULTATION_SESSION (1 : N Client & Provider) -->
  <path d="M 180 405 L 180 480" class="rel-line" marker-end="url(#arrow)" />
  <rect x="150" y="427" width="60" height="22" class="rel-label-box" />
  <text x="156" y="443" class="rel-text">1 : N</text>

  <!-- 4. CONSULTATION_SESSION to SESSION_BILLING_RECORD (1 : N) -->
  <path d="M 410 650 L 540 650" class="rel-line" marker-end="url(#arrow)" />
  <rect x="445" y="637" width="60" height="22" class="rel-label-box" />
  <text x="453" y="653" class="rel-text">1 : N</text>

  <!-- 5. WALLET_TRANSACTION to SESSION_BILLING_RECORD (1 : 1 link) -->
  <path d="M 980 415 L 980 650 L 900 650" class="rel-line" />
  <rect x="945" y="525" width="65" height="22" class="rel-label-box" />
  <text x="953" y="541" class="rel-text">1 : 1 ref</text>

  <!-- Legend -->
  <g transform="translate(930, 780)">
    <rect width="220" height="65" fill="#ffffff" stroke="#cbd5e1" rx="6" />
    <rect x="15" y="15" width="20" height="14" class="pk-badge"/>
    <text x="18" y="26" class="pk-text">PK</text>
    <text x="45" y="26" class="legend-text">Primary Key</text>

    <rect x="15" y="38" width="20" height="14" class="fk-badge"/>
    <text x="18" y="49" class="fk-text">FK</text>
    <text x="45" y="49" class="legend-text">Foreign Key</text>

    <text x="120" y="26" class="legend-text">1 : 1 One-to-One</text>
    <text x="120" y="49" class="legend-text">1 : N One-to-Many</text>
  </g>
</svg>
